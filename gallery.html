<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض المنتجات | ميجا للكاميرات المراقبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00b4d8;
            --bg-light: #f1faee;
            --white: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: #334155;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-title {
            text-align: center;
            font-family: 'Cairo', sans-serif;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .gallery-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-align: center;
            padding-bottom: 1rem;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .img-container {
            width: 100%;
            height: 240px;
            overflow: hidden;
        }
        .img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }
        /* تكبير الصورة تلقائياً عند الوقوف عليها */
        .gallery-card:hover .img-container img {
            transform: scale(1.12);
        }
        .product-tag {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.4rem 1.5rem;
            background-color: var(--primary-color);
            color: var(--white);
            font-weight: bold;
            border-radius: 20px;
            font-size: 0.95rem;
        }
        .back-btn {
            display: block;
            width: fit-content;
            margin: 2.5rem auto 0;
            padding: 0.7rem 1.8rem;
            background-color: var(--primary-color);
            color: var(--white);
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .back-btn:hover {
            background-color: #0096b4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">معرض المنتجات والأنظمة</h1>

        <div class="gallery-grid">
            <!-- صورة 11 -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="11.png" alt="منتج 11">
                </div>
                <span class="product-tag">منتج</span>
            </div>

            <!-- صورة 12 -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="12.png" alt="منتج 12">
                </div>
                <span class="product-tag">منتج</span>
            </div>

            <!-- صورة 13 -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="13.png" alt="منتج 13">
                </div>
                <span class="product-tag">منتج</span>
            </div>

            <!-- صورة 14 -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="14.png" alt="منتج 14">
                </div>
                <span class="product-tag">منتج</span>
            </div>

            <!-- صورة 15 -->
            <div class="gallery-card">
                <div class="img-container">
                    <img src="15.png" alt="منتج 15">
                </div>
                <span class="product-tag">منتج</span>
            </div>
        </div>

        <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </div>

</body>
</html>
