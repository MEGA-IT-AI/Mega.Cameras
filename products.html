<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض المنتجات | ميجا للكاميرات المراقبة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00b4d8;
            --bg-light: #f1faee;
            --white: #ffffff;
            --whatsapp-color: #22c55e;
            --danger-color: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }
        body {
            background-color: var(--bg-light);
            color: #334155;
            padding: 2rem 1rem;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .header-title {
            text-align: center;
            font-family: 'Cairo', sans-serif;
            color: var(--primary-color);
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .gallery-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            text-align: center;
            padding-bottom: 1rem;
            transition: transform 0.3s;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
        }
        .gallery-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .gallery-card h3 {
            margin: 1rem 0 0.5rem;
            font-size: 1.1rem;
            color: var(--primary-color);
        }
        .btn-contact {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.5rem 1.2rem;
            background-color: var(--whatsapp-color);
            color: var(--white);
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .back-btn {
            display: block;
            width: fit-content;
            margin: 2rem auto 0;
            padding: 0.7rem 1.8rem;
            background-color: var(--primary-color);
            color: var(--white);
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="header-title">استفسار عن المنتجات والأنظمة</h1>

        <div class="gallery-grid">
            <!-- صورة 11 -->
            <div class="gallery-card">
                <img src="11.png" alt="منتج 11">
                <h3>منتج / نظام رقم 11</h3>
                <a href="https://wa.me/201010255123?text=استفسار%20عن%20المنتج%2011" class="btn-contact" target="_blank">طلب عبر واتساب</a>
            </div>

            <!-- صورة 12 -->

            </div>

            <!-- صورة 13 -->
            <div class="gallery-card">
                <img src="13.png" alt="منتج 13">
                <h3>منتج / نظام رقم 13</h3>
                <a href="https://wa.me/201010255123?text=استفسار%20عن%20المنتج%2013" class="btn-contact" target="_blank">طلب عبر واتساب</a>
            </div>

            <!-- صورة 14 -->
            <div class="gallery-card">
                <img src="14.png" alt="منتج 14">
                <h3>منتج / نظام رقم 14</h3>
                <a href="https://wa.me/201010255123?text=استفسار%20عن%20المنتج%2014" class="btn-contact" target="_blank">طلب عبر واتساب</a>
            </div>

            <!-- صورة 15 -->
            <div class="gallery-card">
                <img src="15.png" alt="منتج 15">
                <h3>منتج / نظام رقم 15</h3>
                <a href="https://wa.me/201010255123?text=استفسار%20عن%20المنتج%2015" class="btn-contact" target="_blank">طلب عبر واتساب</a>
            </div>
        </div>

        <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </div>

</body>
</html>
